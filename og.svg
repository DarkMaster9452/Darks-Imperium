  <text x="80" y="600" font-family="monospace" font-size="19" letter-spacing="3.4" fill="#7C7590">DIZAJN · VÝVOJ · ANIMÁCIE · VÝKON</text>
  <text x="1120" y="600" text-anchor="end" font-family="monospace" font-size="19" letter-spacing="3.4" fill="#F01F3D">◆ 2026</text>
