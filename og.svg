  <text x="80" y="316" font-family="sans-serif" font-size="92" font-weight="700" letter-spacing="-3.5" fill="#EDEAF5">Weby, ktoré sú presné.</text>
  <text x="80" y="420" font-family="sans-serif" font-size="92" font-weight="700" letter-spacing="-3.5" fill="#F01F3D">A fungujú bezchybne.</text>

