    <radialGradient id="glowB" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7E0A20" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#7E0A20" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F01F3D"/><stop offset="1" stop-color="#F01F3D" stop-opacity="0"/>
