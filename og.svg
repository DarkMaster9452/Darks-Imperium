      <stop stop-color="#F01F3D"/><stop offset="1" stop-color="#7E0A20"/>
    </linearGradient>
    <pattern id="grid" width="72" height="72" patternUnits="userSpaceOnUse">
      <path d="M72 0H0V72" fill="none" stroke="#17131F" stroke-width="1"/>
    </pattern>
    <radialGradient id="glowA" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#F01F3D" stop-opacity="0.30"/>
