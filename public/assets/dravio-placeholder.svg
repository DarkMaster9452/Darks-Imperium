<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 480" width="760" height="480" role="img" aria-label="DRAVIO s.r.o. — náhľad projektu">
  <title>DRAVIO s.r.o. — náhľad projektu</title>

  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#20242b"/>
      <stop offset="1" stop-color="#0f1114"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0f1114" stop-opacity="0"/>
      <stop offset="1" stop-color="#0f1114" stop-opacity=".85"/>
    </linearGradient>
  </defs>

  <rect width="760" height="480" fill="url(#sky)"/>

  <!-- Silueta terénu a sutiny — zástupná grafika, nie screenshot webu. -->
  <g fill="#171a1f">
    <path d="M0 372l84-26 76 18 92-30 88 24 96-34 82 26 78-18 84 22v100H0z"/>
  </g>
  <g fill="#1e2229">
    <path d="M0 412l70-16 88 14 84-20 96 18 78-14 90 20 76-12 78 16v42H0z"/>
  </g>

  <!-- Naznačené rameno bagra -->
  <g stroke="#2b3038" stroke-width="9" stroke-linecap="round" fill="none">
    <path d="M96 404l58-92 96 26"/>
    <path d="M250 338l44 58"/>
  </g>
  <g fill="#2b3038">
    <rect x="60" y="392" width="120" height="30" rx="12"/>
    <path d="M286 386l40-12 14 34-40 12z"/>
  </g>

  <rect width="760" height="480" fill="url(#fade)"/>

  <!-- Wordmark -->
  <g font-family="Verdana, DejaVu Sans, sans-serif" text-anchor="middle">
    <rect x="272" y="132" width="216" height="26" rx="13" fill="#ec6b1f" fill-opacity=".16"/>
    <text x="380" y="150" font-size="12" font-weight="700" letter-spacing="2.4" fill="#f08a3c">
      RAJECKÁ DOLINA
    </text>

    <text x="380" y="228" font-size="60" font-weight="700" letter-spacing="3" fill="#f4f4f4">
      DRAVIO
    </text>
    <text x="380" y="262" font-size="15" font-weight="700" letter-spacing="3.4" fill="#ec6b1f">
      VÝKOPOVÉ A DEMOLAČNÉ PRÁCE
    </text>

    <text x="380" y="316" font-size="14" fill="#9a9a9a">
      dravio.sk
    </text>
  </g>

  <!-- Jemný rámik, aby karta držala tvar aj na tmavom podklade -->
  <rect x=".5" y=".5" width="759" height="479" fill="none" stroke="#ffffff" stroke-opacity=".06"/>
